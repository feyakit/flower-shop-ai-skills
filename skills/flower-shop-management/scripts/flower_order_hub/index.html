<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花店订单中台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f3;
      --panel: #ffffff;
      --ink: #1f2523;
      --muted: #66716d;
      --line: #dfe5df;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --warn: #b45309;
      --danger: #b42318;
      --soft-green: #e8f5f1;
      --soft-amber: #fff4df;
      --soft-lilac: #f2edff;
      --shadow: 0 14px 35px rgba(31, 37, 35, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      min-height: 38px;
      padding: 0 14px;
      background: #eef2ef;
      color: var(--ink);
    }

    button:hover {
      filter: brightness(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .primary {
      background: var(--brand);
      color: #fff;
    }

    .primary:hover {
      background: var(--brand-dark);
    }

    .danger {
      background: #fff0ed;
      color: var(--danger);
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--brand), #d97706);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: #9ca3af;
      display: inline-block;
      margin-right: 6px;
    }

    .status-dot.ok {
      background: #059669;
    }

    .status-dot.bad {
      background: var(--danger);
    }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(280px, 1fr) 430px;
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 64px);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
      overflow: hidden;
    }

    .panel-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-head h2 {
      font-size: 16px;
      margin: 0;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 16px;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 11px;
      outline: none;
      min-height: 38px;
    }

    textarea {
      min-height: 210px;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      min-width: 0;
    }

    .grow {
      flex: 1;
    }

    .orders {
      display: grid;
      gap: 10px;
      max-height: calc(100vh - 144px);
      overflow: auto;
      padding: 12px;
    }

    .order-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 8px;
      cursor: pointer;
    }

    .order-card.active {
      border-color: var(--brand);
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .order-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      min-width: 0;
    }

    .order-title span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      background: #eef2ef;
      color: #34403c;
      white-space: nowrap;
    }

    .pill.ready {
      background: var(--soft-green);
      color: #047857;
    }

    .pill.review {
      background: var(--soft-amber);
      color: var(--warn);
    }

    .pill.sent {
      background: var(--soft-lilac);
      color: #5b21b6;
    }

    .pill.badge-danger {
      background: #fff0ed;
      color: var(--danger);
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .fields .wide {
      grid-column: 1 / -1;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
    }

    .upload-box {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 10px;
      background: #fbfcfb;
    }

    .upload-preview {
      width: 100%;
      min-height: 120px;
      border-radius: 8px;
      background: #eef2ef;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--muted);
    }

    .upload-preview img {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      display: block;
      background: #fff;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100vw - 36px));
      background: #1f2523;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: none;
      z-index: 10;
      overflow-wrap: anywhere;
    }

    .toast.show {
      display: block;
    }

    .api-box {
      display: none;
      gap: 8px;
      position: absolute;
      right: 24px;
      top: 58px;
      width: min(520px, calc(100vw - 32px));
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 8;
    }

    .api-box.open {
      display: grid;
    }

    .settings-section {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .settings-title {
      font-weight: 700;
      font-size: 13px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 340px 1fr;
      }

      .detail-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        height: auto;
        min-height: 64px;
        align-items: flex-start;
        padding: 12px;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        justify-content: space-between;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .orders {
        max-height: none;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .api-box {
        left: 12px;
        right: 12px;
        top: 106px;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">花</div>
      <div>
        <h1>花店订单中台</h1>
        <div class="subtle">微信录单 · 多地区订单 · 打印配送单</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="subtle"><span id="healthDot" class="status-dot"></span><span id="healthText">连接中</span></span>
      <select id="regionFilter" style="width:150px">
        <option value="">全部地区</option>
      </select>
      <button id="printListBtn" type="button">打印列表</button>
      <button id="refreshBtn" type="button">刷新</button>
      <button id="apiBtn" type="button">打印机</button>
    </div>
    <div id="apiBox" class="api-box">
      <div class="settings-section">
        <div class="settings-title">打印机连接方式</div>
        <div class="hint">先在电脑系统里连接门店打印机，然后点击“打印订单”或“打印列表”。浏览器会弹出系统打印窗口，在里面选择对应打印机即可。</div>
        <div class="hint">多地区使用时，每个地区/门店只需要在自己的电脑上打开这个系统，筛选自己的地区，再打印当前列表。</div>
        <button id="testPrintBtn" class="primary" type="button">打开打印测试页</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>快速录单</h2>
        <span class="pill">个人微信</span>
      </div>
      <div class="panel-body stack">
        <label>
          来源
          <select id="source">
            <option value="wechat_text">个人微信</option>
            <option value="xhs_text">小红书私信</option>
            <option value="phone_note">电话记录</option>
            <option value="manual">手动录入</option>
          </select>
        </label>
        <label>
          聊天内容
          <textarea id="chatText" placeholder="粘贴客户聊天内容，例如：
收花人：杨鑫
电话：13068396890
地址：重庆市北碚区复兴街道思源人才公寓4组团1栋407
祝福语：愿岁岁相伴
配送时间段：7月1日10时至11时"></textarea>
        </label>
        <div class="row">
          <button id="parseBtn" class="primary grow" type="button">生成订单</button>
          <button id="clearBtn" type="button">清空</button>
        </div>
        <div id="parseResult" class="subtle"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>订单列表</h2>
        <span id="orderCount" class="pill">0 单</span>
      </div>
      <div id="orders" class="orders"></div>
    </section>

    <section class="panel detail-panel">
      <div class="panel-head">
        <h2>订单详情</h2>
        <span id="detailStatus" class="pill">未选择</span>
      </div>
      <div class="panel-body">
        <div id="emptyDetail" class="empty">选择一笔订单后，可以核对字段、补齐信息并打印配送单。</div>
        <form id="detailForm" class="stack" style="display:none">
          <div class="row">
            <span id="orderId" class="pill"></span>
            <span id="missingPills" class="row"></span>
            <span id="riskPills" class="row"></span>
          </div>
          <div class="fields">
            <label class="wide">
              地区/门店
              <input name="region" placeholder="例如：重庆北碚、上海静安、武汉光谷">
            </label>
            <label>
              收花人
              <input name="receiver_name">
            </label>
            <label>
              电话
              <input name="receiver_phone">
            </label>
            <label class="wide">
              地址
              <input name="delivery_address">
            </label>
            <label>
              日期
              <input name="delivery_date" type="date">
            </label>
            <label>
              时间段
              <input name="delivery_time_range">
            </label>
            <label class="wide">
              祝福语/卡片内容
              <input name="card_message">
            </label>
            <label class="wide">
              备注
              <textarea name="notes" style="min-height:86px"></textarea>
            </label>
            <label class="wide">
              商品图
              <div class="upload-box">
                <input id="productImageFile" type="file" accept="image/*">
                <input name="product_image" type="hidden">
                <div id="productImagePreview" class="upload-preview">还没有上传商品图</div>
                <div class="row">
                  <button id="removeImageBtn" type="button">移除图片</button>
                </div>
              </div>
            </label>
          </div>
          <div class="row">
            <button id="saveBtn" class="primary" type="submit">保存修改</button>
            <button id="reparseBtn" type="button">重新解析</button>
            <button id="copyDispatchBtn" type="button">复制订单</button>
            <button id="printOrderBtn" type="button">打印订单</button>
            <button id="deleteBtn" class="danger" type="button">删除订单</button>
          </div>
          <label>
            原始聊天
            <textarea name="raw_text" style="min-height:110px"></textarea>
          </label>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const state = {
      orders: [],
      selectedId: "",
      currentRegion: localStorage.getItem("flowerOrderRegion") || "",
      apiBase: localStorage.getItem("flowerOrderApiBase") || (location.protocol === "file:" ? "http://127.0.0.1:8787" : location.origin)
    };

    const fields = [
      "region",
      "receiver_name",
      "receiver_phone",
      "delivery_address",
      "delivery_date",
      "delivery_time_range",
      "product_image",
      "card_message",
      "notes",
      "raw_text"
    ];

    const statusLabel = {
      needs_review: "待补齐",
      ready_to_dispatch: "可发单",
      dispatched: "已处理",
      draft: "草稿"
    };

    const statusClass = {
      needs_review: "review",
      ready_to_dispatch: "ready",
      dispatched: "sent",
      draft: ""
    };

    const $ = (id) => document.getElementById(id);

    function api(path, options = {}) {
      return fetch(state.apiBase.replace(/\/$/, "") + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }).then(async (response) => {
        const text = await response.text();
        const data = text ? JSON.parse(text) : {};
        if (!response.ok) {
          throw new Error(data.error || response.statusText);
        }
        return data;
      });
    }

    function toast(message) {
      const node = $("toast");
      node.textContent = message;
      node.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => node.classList.remove("show"), 3200);
    }

    function setBusy(button, busy, text) {
      if (!button) return;
      if (busy) {
        button.dataset.label = button.textContent;
        button.textContent = text || "处理中";
        button.disabled = true;
      } else {
        button.textContent = button.dataset.label || button.textContent;
        button.disabled = false;
      }
    }

    function statusPill(status) {
      const label = statusLabel[status] || status || "未知";
      const cls = statusClass[status] || "";
      return `<span class="pill ${cls}">${escapeHtml(label)}</span>`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function orderTitle(order) {
      return order.receiver_name || order.receiver_phone || "未命名订单";
    }

    async function checkHealth() {
      try {
        await api("/health");
        $("healthDot").className = "status-dot ok";
        $("healthText").textContent = "已连接";
      } catch (error) {
        $("healthDot").className = "status-dot bad";
        $("healthText").textContent = "未连接";
      }
    }

    async function loadRegions() {
      try {
        const regions = await api("/api/regions");
        const options = ['<option value="">全部地区</option>']
          .concat((regions || []).map((region) => `<option value="${escapeHtml(region)}">${escapeHtml(region)}</option>`));
        $("regionFilter").innerHTML = options.join("");
        $("regionFilter").value = state.currentRegion;
      } catch (error) {
        toast(`读取地区失败：${error.message}`);
      }
    }

    async function loadOrders(selectFirst = false) {
      const query = state.currentRegion ? `?region=${encodeURIComponent(state.currentRegion)}` : "";
      const data = await api(`/api/orders${query}`);
      state.orders = Array.isArray(data) ? data : [];
      if (selectFirst && state.orders[0]) {
        state.selectedId = state.orders[0].id;
      }
      renderOrders();
      renderDetail();
    }

    function renderOrders() {
      $("orderCount").textContent = `${state.orders.length} 单`;
      const wrap = $("orders");
      if (!state.orders.length) {
        wrap.innerHTML = `<div class="empty">还没有订单。先在左侧粘贴微信聊天内容生成一单。</div>`;
        return;
      }
      wrap.innerHTML = state.orders.map((order) => {
        const active = order.id === state.selectedId ? "active" : "";
        const missing = (order.missing_fields || []).length;
        const risk = (order.risk_flags || []).length;
        return `
          <article class="order-card ${active}" data-id="${escapeHtml(order.id)}">
            <div class="order-title">
              <span>${escapeHtml(orderTitle(order))}</span>
              ${statusPill(order.status)}
            </div>
            <div class="meta">${escapeHtml(order.delivery_date || "未定日期")} ${escapeHtml(order.delivery_time_range || "")}</div>
            <div class="meta">${escapeHtml(order.delivery_address || "地址待补充")}</div>
            <div class="row">
              <span class="pill">${escapeHtml(order.source || "来源未知")}</span>
              ${order.region ? `<span class="pill">${escapeHtml(order.region)}</span>` : ""}
              ${order.product_image ? `<span class="pill ready">有图</span>` : ""}
              ${missing ? `<span class="pill review">缺 ${missing}</span>` : ""}
              ${risk ? `<span class="pill badge-danger">风险 ${risk}</span>` : ""}
            </div>
          </article>
        `;
      }).join("");
      wrap.querySelectorAll(".order-card").forEach((card) => {
        card.addEventListener("click", () => {
          state.selectedId = card.dataset.id;
          renderOrders();
          renderDetail();
        });
      });
    }

    function selectedOrder() {
      return state.orders.find((order) => order.id === state.selectedId);
    }

    function renderDetail() {
      const order = selectedOrder();
      const form = $("detailForm");
      const empty = $("emptyDetail");
      if (!order) {
        form.setAttribute("style", "display:none");
        empty.style.display = "grid";
        $("detailStatus").className = "pill";
        $("detailStatus").textContent = "未选择";
        return;
      }
      empty.style.display = "none";
      form.setAttribute("style", "display:grid");
      $("orderId").textContent = order.id;
      $("detailStatus").className = `pill ${statusClass[order.status] || ""}`;
      $("detailStatus").textContent = statusLabel[order.status] || order.status || "未知";

      fields.forEach((name) => {
        const input = form.elements[name];
        if (input) input.value = order[name] || "";
      });
      renderProductImage(order.product_image || "");

      $("missingPills").innerHTML = (order.missing_fields || []).map((item) => `<span class="pill review">${escapeHtml(item)}</span>`).join("");
      $("riskPills").innerHTML = (order.risk_flags || []).map((item) => `<span class="pill badge-danger">${escapeHtml(item)}</span>`).join("");
    }

    function renderProductImage(value) {
      const preview = $("productImagePreview");
      if (!preview) return;
      if (value) {
        preview.innerHTML = `<img src="${escapeHtml(value)}" alt="商品图">`;
      } else {
        preview.textContent = "还没有上传商品图";
      }
    }

    async function parseText() {
      const text = $("chatText").value.trim();
      if (!text) {
        toast("请先粘贴聊天内容");
        return;
      }
      setBusy($("parseBtn"), true, "生成中");
      try {
        const data = await api("/api/ingest/text", {
          method: "POST",
          body: JSON.stringify({ source: $("source").value, text, region: state.currentRegion })
        });
        state.selectedId = data.order.id;
        $("parseResult").textContent = `已生成订单 ${data.order.id}`;
        await loadOrders();
        await loadRegions();
        toast("订单已生成");
      } catch (error) {
        toast(error.message);
      } finally {
        setBusy($("parseBtn"), false);
      }
    }

    async function saveSelected(event) {
      event.preventDefault();
      const order = selectedOrder();
      if (!order) return;
      const payload = {};
      fields.forEach((name) => {
        const input = event.currentTarget.elements[name];
        if (input) payload[name] = input.value.trim();
      });
      setBusy($("saveBtn"), true, "保存中");
      try {
        const data = await api(`/api/orders/${encodeURIComponent(order.id)}`, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        state.orders = state.orders.map((item) => item.id === order.id ? data.order : item);
        renderOrders();
        renderDetail();
        toast("已保存");
      } catch (error) {
        toast(error.message);
      } finally {
        setBusy($("saveBtn"), false);
      }
    }

    async function reparseSelected() {
      const order = selectedOrder();
      if (!order) return;
      setBusy($("reparseBtn"), true, "解析中");
      try {
        const data = await api(`/api/orders/${encodeURIComponent(order.id)}/reparse`, {
          method: "POST",
          body: "{}"
        });
        state.orders = state.orders.map((item) => item.id === order.id ? data.order : item);
        renderOrders();
        renderDetail();
        toast("已按新规则重新解析");
      } catch (error) {
        toast(error.message);
      } finally {
        setBusy($("reparseBtn"), false);
      }
    }

    async function copyDispatchSelected() {
      const order = selectedOrder();
      if (!order) return;
      setBusy($("copyDispatchBtn"), true, "复制中");
      try {
        const data = await api(`/api/orders/${encodeURIComponent(order.id)}/print-preview`);
        await navigator.clipboard.writeText(data.text || JSON.stringify(data.payload, null, 2));
        toast("订单内容已复制");
      } catch (error) {
        toast(`复制失败：${error.message}`);
      } finally {
        setBusy($("copyDispatchBtn"), false);
      }
    }

    async function deleteSelected() {
      const order = selectedOrder();
      if (!order) return;
      const label = order.receiver_name || order.receiver_phone || order.id;
      if (!confirm(`确定删除订单 ${label} 吗？删除后不能在页面里恢复。`)) {
        return;
      }
      setBusy($("deleteBtn"), true, "删除中");
      try {
        await api(`/api/orders/${encodeURIComponent(order.id)}`, { method: "DELETE" });
        state.selectedId = "";
        await loadOrders(true);
        toast("订单已删除");
      } catch (error) {
        toast(`删除失败：${error.message}`);
      } finally {
        setBusy($("deleteBtn"), false);
      }
    }

    function printSelected() {
      const order = selectedOrder();
      if (!order) return;
      window.open(`${state.apiBase.replace(/\/$/, "")}/print/order/${encodeURIComponent(order.id)}`, "_blank");
    }

    function printCurrentList() {
      const query = state.currentRegion ? `?region=${encodeURIComponent(state.currentRegion)}` : "";
      window.open(`${state.apiBase.replace(/\/$/, "")}/print/orders${query}`, "_blank");
    }

    function bind() {
      $("apiBtn").addEventListener("click", () => $("apiBox").classList.toggle("open"));
      $("testPrintBtn").addEventListener("click", printCurrentList);
      $("printListBtn").addEventListener("click", printCurrentList);
      $("regionFilter").addEventListener("change", async () => {
        state.currentRegion = $("regionFilter").value;
        localStorage.setItem("flowerOrderRegion", state.currentRegion);
        state.selectedId = "";
        await loadOrders(true);
      });
      $("refreshBtn").addEventListener("click", () => boot());
      $("parseBtn").addEventListener("click", parseText);
      $("clearBtn").addEventListener("click", () => {
        $("chatText").value = "";
        $("parseResult").textContent = "";
      });
      $("productImageFile").addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          toast("请选择图片文件");
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          toast("图片请控制在 2MB 以内");
          event.target.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const value = String(reader.result || "");
          $("detailForm").elements.product_image.value = value;
          renderProductImage(value);
        };
        reader.readAsDataURL(file);
      });
      $("removeImageBtn").addEventListener("click", () => {
        $("detailForm").elements.product_image.value = "";
        $("productImageFile").value = "";
        renderProductImage("");
      });
      $("detailForm").addEventListener("submit", saveSelected);
      $("reparseBtn").addEventListener("click", reparseSelected);
      $("copyDispatchBtn").addEventListener("click", copyDispatchSelected);
      $("printOrderBtn").addEventListener("click", printSelected);
      $("deleteBtn").addEventListener("click", deleteSelected);
    }

    async function boot() {
      await checkHealth();
      await loadRegions();
      try {
        await loadOrders(!state.selectedId);
      } catch (error) {
        $("orders").innerHTML = `<div class="empty">无法读取订单：${escapeHtml(error.message)}</div>`;
      }
    }

    bind();
    boot();
  </script>
</body>
</html>
